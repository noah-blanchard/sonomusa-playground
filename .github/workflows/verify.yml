name: verify

# The gates existed before this file did; nothing ran them except by someone
# remembering to. `bun run verify` already chains registry check → content
# validation → architecture check → typecheck → lint → unit tests → build, so
# the workflow stays thin on purpose: the definition of "green" lives in
# package.json, where a contributor can run exactly what CI runs.
on:
  push:
    branches: ['**']
  pull_request:

# A force-push mid-run should cancel the run it superseded rather than race it.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # --frozen-lockfile, so a lockfile that disagrees with package.json fails
      # here rather than resolving to something no one has run locally.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      # Only chromium. The overflow assertion is about layout arithmetic, not
      # engine differences, and three browsers would triple the slowest step to
      # re-check the same numbers.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end
        run: bun run test:e2e

      # The report is only interesting when something failed, and that is
      # exactly when the run has no other trace of what the page looked like.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
